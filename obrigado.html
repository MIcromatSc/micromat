<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Mensagem enviada</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 50px;
}
</style>
</head>

<body>

<h1>
  <span class="pt">Mensagem enviada com sucesso!</span>
  <span class="en" style="display:none;">Message sent successfully!</span>
</h1>

<p>
  <span class="pt">Obrigado pelo contato.</span>
  <span class="en" style="display:none;">Thank you for reaching out.</span>
</p>

<a href="index.html">
  <span class="pt">Voltar ao site</span>
  <span class="en" style="display:none;">Back to website</span>
</a>

<br><br>

<button onclick="trocarIdioma()">EN/PT</button>

<script>
let idioma = "pt";

function trocarIdioma() {
  idioma = (idioma === "pt") ? "en" : "pt";

  document.querySelectorAll(".pt").forEach(el => {
    el.style.display = (idioma === "pt") ? "inline" : "none";
  });

  document.querySelectorAll(".en").forEach(el => {
    el.style.display = (idioma === "en") ? "inline" : "none";
  });
}
</script>

</body>
</html>
